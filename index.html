<!doctype html>
<html lang="en-SG">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F4F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A0C11" media="(prefers-color-scheme: dark)">
<title>Ethan's Ledger</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ledger">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..500,0..1,0&icon_names=add,donut_large,favorite,insights,more_horiz,receipt_long,trending_up&display=block" rel="stylesheet">
<style>/* Radius rule: cards 22px, controls 14px, chips/buttons full pill. */
:root{
  --bg:#F2F4F8;--surface:#FFFFFF;--sunk:#EBEEF4;--ink:#0D1017;--muted:#5D6472;--line:#E3E7EE;
  --accent:#2E5BFF;--accent-soft:#E6ECFF;--accent-ink:#FFFFFF;
  --gain:#0E9F6E;--gain-soft:#E1F6EE;--loss:#E0424E;--loss-soft:#FDE8EA;--rose:#E3337A;--rose-soft:#FDE6EF;
  --hero:#0D1017;--hero-ink:#FFFFFF;--hero-muted:#9AA3B5;
  --seg1:#2E5BFF;--seg2:#6E8CFF;--seg3:#A9BBFF;--seg4:#CDD5E4;--seg5:#E1E6EF;
  --shadow:0 1px 2px rgba(22,34,70,.05),0 8px 24px rgba(22,34,70,.06);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A0C11;--surface:#141821;--sunk:#1C212C;--ink:#EEF1F7;--muted:#98A1B3;--line:#252B37;
  --accent:#6C8CFF;--accent-soft:#1B2447;--accent-ink:#0A0C11;
  --gain:#34D399;--gain-soft:#10281F;--loss:#FF6B75;--loss-soft:#33161A;--rose:#FF6FA8;--rose-soft:#351725;
  --hero:#1A2033;--hero-ink:#FFFFFF;--hero-muted:#A3ACC0;
  --seg1:#6C8CFF;--seg2:#4F6AD0;--seg3:#3A4D94;--seg4:#2B3346;--seg5:#222836;
  --shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0A0C11;--surface:#141821;--sunk:#1C212C;--ink:#EEF1F7;--muted:#98A1B3;--line:#252B37;
  --accent:#6C8CFF;--accent-soft:#1B2447;--accent-ink:#0A0C11;
  --gain:#34D399;--gain-soft:#10281F;--loss:#FF6B75;--loss-soft:#33161A;--rose:#FF6FA8;--rose-soft:#351725;
  --hero:#1A2033;--hero-ink:#FFFFFF;--hero-muted:#A3ACC0;
  --seg1:#6C8CFF;--seg2:#4F6AD0;--seg3:#3A4D94;--seg4:#2B3346;--seg5:#222836;
  --shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark;}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 "Geist",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.num,.big{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.98)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ms{font-family:"Material Symbols Rounded";font-weight:400;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;direction:ltr;-webkit-font-smoothing:antialiased;font-variation-settings:"FILL" 0,"wght" 400,"opsz" 24;display:inline-block;width:1em;overflow:hidden}
main{max-width:560px;margin:0 auto;padding:10px 16px 120px;animation:in .22s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
header.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0 14px}
header.top h1{font:700 26px/1.15 "Geist",sans-serif;letter-spacing:-.03em;margin:0}
.monthsw{display:flex;align-items:center;gap:2px;background:var(--surface);border-radius:999px;padding:3px;box-shadow:var(--shadow)}
.monthsw button{background:none;border:0;width:34px;height:34px;border-radius:999px;font-size:20px;color:var(--muted)}
.monthsw button:hover{background:var(--sunk)}
.monthsw span{min-width:0;white-space:nowrap;padding:0 4px;text-align:center;font-weight:600;font-size:14.5px}
.sync{font-size:11.5px;color:var(--muted);white-space:nowrap}
.sync:not(:empty)::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gain);margin-right:5px;vertical-align:1px}
.hr{display:flex;align-items:center;gap:6px}
button.icon{background:var(--surface);border:0;width:38px;height:38px;border-radius:999px;color:var(--ink);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
button.icon .ms{font-size:22px}
/* hero: the one bold moment */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:22px;padding:20px 20px 18px;margin:0 0 12px;position:relative;overflow:hidden;
  background-image:radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--accent) 45%,transparent) 0%,transparent 55%)}
.hero .lbl{color:var(--hero-muted);font-size:14px}
.hero .big{font-size:54px;line-height:1.05;font-weight:700;letter-spacing:-.045em;margin:6px 0 4px;color:var(--hero-ink)}
.hero .big small{font-size:26px;font-weight:600;color:var(--hero-muted);margin-right:3px;letter-spacing:0;vertical-align:.55em}
.hero .big.pos{color:var(--gain)}.hero .big.neg{color:var(--loss)}
.hero .sub{color:var(--hero-muted);font-size:13.5px}
.tape{display:flex;height:12px;border-radius:999px;overflow:hidden;margin:18px 0 2px;background:rgba(255,255,255,.1);gap:2px}
.tape i{display:block;height:100%;min-width:3px;border-radius:2px}
.tape i.al{background:var(--rose)!important}
.hero .tape i{opacity:.95}
.legend{list-style:none;margin:0;padding:0}
.legend li{display:grid;grid-template-columns:34px 1fr auto auto;gap:10px;align-items:center;padding:9px 0;font-size:14.5px}
.legend li+li{border-top:1px solid var(--line)}
.legend .sw{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:17px;position:relative;background:var(--sunk)}
.legend .sw::after{content:"";position:absolute;right:-2px;bottom:-2px;width:11px;height:11px;border-radius:50%;background:var(--c,transparent);border:2px solid var(--surface)}
.legend .amt{font-weight:600}
.delta{font-size:12px;min-width:56px;text-align:right;font-weight:500;border-radius:999px;padding:2px 7px}
.delta.up{background:var(--loss-soft)}.delta.down{background:var(--gain-soft)}
.up{color:var(--loss)}.down{color:var(--gain)}.flat{color:var(--muted)}
/* stat bento */
.strip{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 22px}
.strip div{background:var(--surface);border-radius:22px;padding:14px 16px;box-shadow:var(--shadow)}
.strip div:last-child{grid-column:1 / -1;display:flex;justify-content:space-between;align-items:center;background:var(--gain-soft);box-shadow:none}
.strip div:last-child:has(.neg){background:var(--loss-soft)}
.strip b{display:block;font:700 22px/1.2 "Geist",sans-serif;letter-spacing:-.02em}
.strip div:last-child b{font-size:28px;order:2}
.strip span{font-size:13px;color:var(--muted)}
section.blk{margin:0 0 24px}
section.blk>h2{font:700 18px/1.3 "Geist",sans-serif;letter-spacing:-.02em;margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
section.blk>h2 a,section.blk>h2 button{font:600 13.5px "Geist",sans-serif;color:var(--accent);background:none;border:0;padding:0;text-decoration:none}
.panel{background:var(--surface);border-radius:22px;padding:4px 16px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.row+.row,.row+button.row,button.row+.row,button.row+button.row{border-top:1px solid var(--line)}
.row .l{min-width:0;flex:1}
.row .l b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .l span{font-size:12.5px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .r{text-align:right;white-space:nowrap;font-weight:600}
.row .r span{display:block;font-size:12px;color:var(--muted);font-weight:400}
button.row{width:100%;background:none;border:0;text-align:left;padding:12px 0;border-radius:0}
button.row:active{transform:none;opacity:.7}
.av{flex:0 0 auto;width:40px;height:40px;border-radius:13px;background:var(--sunk);display:flex;align-items:center;justify-content:center;font-size:19px}
.av.al{background:var(--rose-soft)}
.pos{color:var(--gain)}.neg{color:var(--loss)}
.bar{height:8px;background:var(--sunk);border-radius:999px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.bar i.over{background:var(--loss)}
.note{font-size:13px;color:var(--muted);margin:8px 2px 0}
.empty{padding:26px 8px;color:var(--muted);text-align:center}
.empty button{margin-top:12px}
.trend{background:var(--surface);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.trend svg{width:100%;height:auto;display:block}
.trend text{fill:var(--muted);font-size:10px;font-family:"Geist",sans-serif}
/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:0;background:var(--surface);border-radius:999px;padding:8px 14px;font-size:13.5px;font-weight:500;white-space:nowrap;box-shadow:var(--shadow)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chip.rose{color:var(--rose)}
.chip.rose[aria-pressed="true"]{background:var(--rose);color:#fff}
.wrap .chip{box-shadow:none;background:var(--sunk)}
.wrap .chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.wrap .chip.rose[aria-pressed="true"]{background:var(--rose);color:#fff}
.search{width:100%;padding:12px 16px;border:0;border-radius:14px;background:var(--surface);margin-bottom:12px;box-shadow:var(--shadow)}
.day{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--muted);padding:16px 4px 8px}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--rose-soft);color:var(--rose);margin-left:6px;vertical-align:1px}
/* nav: floating pill */
nav.tabs{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:10;max-width:520px;margin:0 auto;
  background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
  border:1px solid color-mix(in srgb,var(--line) 70%,transparent);border-radius:999px;padding:6px 8px;box-shadow:0 10px 30px rgba(15,25,60,.14)}
nav.tabs .in{display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
nav.tabs button{background:none;border:0;padding:5px 0;font-size:11px;font-weight:500;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px;border-radius:999px}
nav.tabs button .ms{font-size:23px}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
nav.tabs button[aria-current="page"] .ms{font-variation-settings:"FILL" 1,"wght" 500,"opsz" 24}
nav.tabs .add{justify-self:center;width:52px;height:52px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:30px;line-height:1;display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 45%,transparent);padding:0}
nav.tabs .add .ms{font-size:30px}
@media (prefers-reduced-transparency:reduce){nav.tabs{background:var(--surface);backdrop-filter:none}}
/* sheet */
dialog.sheet{border:0;padding:0;margin:auto auto 0;width:100%;max-width:560px;max-height:92%;border-radius:26px 26px 0 0;background:var(--bg);color:var(--ink);overflow:auto;animation:up .24s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
dialog.sheet::backdrop{background:rgba(8,12,24,.5);backdrop-filter:blur(2px)}
.sheet .hd{position:sticky;top:0;background:var(--bg);display:flex;justify-content:space-between;align-items:center;padding:12px 18px 8px;z-index:1}
.sheet .hd::before{content:"";position:absolute;top:6px;left:50%;width:38px;height:4px;border-radius:999px;background:var(--line);transform:translateX(-50%)}
.sheet .hd h3{margin:8px 0 0;font:700 20px "Geist",sans-serif;letter-spacing:-.02em}
.sheet .hd button{background:var(--surface);border:0;font-size:14px;font-weight:600;color:var(--muted);padding:7px 14px;border-radius:999px;margin-top:8px}
.sheet .bd{padding:6px 18px calc(24px + env(safe-area-inset-bottom,0px))}
.seg{display:flex;background:var(--sunk);border-radius:999px;padding:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;padding:9px 6px;border-radius:999px;font-size:14px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}
.amt-in{display:flex;align-items:baseline;gap:6px;background:var(--surface);border-radius:22px;padding:16px 18px;margin:4px 0 14px;box-shadow:var(--shadow)}
.amt-in span{font:600 28px "Geist",sans-serif;color:var(--muted)}
.amt-in input{border:0;background:none;outline:none;font:700 44px/1.05 "Geist",sans-serif;letter-spacing:-.04em;width:100%}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:14px 2px 7px}
input.t,select.t,textarea.t{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.wrap{display:flex;flex-wrap:wrap;gap:7px}
.actions{display:flex;gap:10px;margin-top:22px}
.btn{flex:1;border:0;border-radius:999px;padding:15px;font-weight:700;background:var(--accent);color:var(--accent-ink);font-size:15px}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.btn.danger{background:var(--loss-soft);color:var(--loss);flex:0 0 auto;padding:15px 18px}
.btn.sm{flex:0 0 auto;padding:10px 18px;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;z-index:20;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-4px)}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px;margin:8px 0}
.kv span:nth-child(odd){color:var(--muted)}
.kv span:nth-child(even){text-align:right;font-weight:600}
.pl-big{font:700 36px/1.1 "Geist",sans-serif;letter-spacing:-.035em;margin:4px 0}
.warn{font-size:12.5px;color:var(--accent);font-weight:500}
.banner{display:flex;flex-direction:column;width:100%;text-align:left;border:0;background:var(--accent-soft);border-radius:18px;padding:12px 16px;margin:0 0 12px}
.banner b{font-weight:700;color:var(--accent)}
.banner span{font-size:13px;color:var(--muted)}
.banner.quiet{background:var(--surface);box-shadow:var(--shadow);margin:0 0 24px}
.banner.quiet b{color:var(--ink)}
/* insights */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0 0 24px}
.kpis div{background:var(--surface);border-radius:22px;padding:14px 16px;box-shadow:var(--shadow)}
.kpis div:first-child{background:var(--hero);color:var(--hero-ink);box-shadow:none}
.kpis div:first-child span,.kpis div:first-child i{color:var(--hero-muted)}
.kpis div:nth-child(3){background:var(--rose-soft);box-shadow:none}
.kpis span{display:block;font-size:13px;color:var(--muted)}
.kpis b{display:block;font:700 28px/1.15 "Geist",sans-serif;letter-spacing:-.035em;margin:4px 0 2px}
.kpis i{font-style:normal;font-size:12px;color:var(--muted)}
section.blk:has(.cw){background:var(--surface);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.cw{position:relative;width:100%}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin:0 0 10px}
.lg span{display:inline-flex;align-items:center;gap:5px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;background:var(--surface);border-radius:22px;padding:14px;box-shadow:var(--shadow)}
.heat i,.lg i.h0,.lg i.h1,.lg i.h2,.lg i.h3,.lg i.h4{aspect-ratio:1;border-radius:3px;display:block}
.lg span i[class^="h"]{width:11px;height:11px}
.h0{background:var(--sunk)}
.h1{background:color-mix(in srgb,var(--accent) 22%,var(--surface))}.h2{background:color-mix(in srgb,var(--accent) 45%,var(--surface))}
.h3{background:color-mix(in srgb,var(--accent) 72%,var(--surface))}.h4{background:var(--accent)}
.tbl{padding:4px 14px;overflow-x:auto}
.tbl .th,.tbl .tr{display:grid;grid-template-columns:minmax(0,1.6fr) 1fr .6fr 1fr;gap:8px;padding:10px 0;font-size:13.5px;align-items:center}
.tbl .tr{border-top:1px solid var(--line)}
.tbl .th{font-size:12px;color:var(--muted);font-weight:600}
.tbl .tr span:not(:first-child),.tbl .th span:not(:first-child){text-align:right}
.tbl .tr span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl .tr i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:7px}
.row.closed{opacity:.5}
.irow{gap:10px}
.irow.off .l b{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 50%,transparent)}
.ck{flex:0 0 auto;width:26px;height:26px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);color:var(--accent-ink);font-size:14px;font-weight:700;padding:0}
.ck[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.chip.sm{padding:3px 10px;font-size:11.5px;margin-top:5px}
.match{color:var(--accent)!important}
.csel{margin-top:5px;max-width:100%;font-size:12.5px;padding:4px 8px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.legend-wrap{margin:0 0 12px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.row .l b .tag{display:inline-block;font-size:11px;color:var(--rose)}
details.fold{border-top:1px solid var(--line)}
details.fold summary{list-style:none;cursor:pointer;padding:12px 0;font-size:13.5px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:6px}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary::before{content:"›";display:inline-block;transition:transform .15s;font-size:17px;color:var(--muted)}
details.fold[open] summary::before{transform:rotate(90deg)}
details.fold[open] summary{border-bottom:1px solid var(--line)}
details.fold .row:first-of-type{border-top:0}

/* ---------------------------------------------------------------
   Responsive layer. Mobile first: one column, 44px touch targets.
   768px: two columns. 1024px: three, with hover and active states.
   --------------------------------------------------------------- */

/* Touch targets: every interactive element clears 44px on touch devices */
nav.tabs button{min-height:48px;justify-content:center}
button.icon{width:44px;height:44px}
.monthsw button{width:44px;height:44px}
.monthsw span{min-height:44px;display:flex;align-items:center;justify-content:center}
.chip{min-height:44px;display:inline-flex;align-items:center;padding:0 16px}
.chip.sm{min-height:34px;padding:0 12px}
.row,button.row{min-height:52px}
.seg button{min-height:44px}
.btn{min-height:48px}
.btn.sm{min-height:40px}
input.t,select.t,.search{min-height:48px}
.ck{width:32px;height:32px;position:relative}
.ck::after{content:"";position:absolute;inset:-8px} /* invisible 48px tap area */
.legend li{min-height:52px}
details.fold summary{min-height:48px}
input[type="checkbox"]{width:22px;height:22px}

/* Pointer devices: hover and pressed feedback */
@media (hover:hover) and (pointer:fine){
  button.row:hover,.row:hover{background:var(--sunk)}
  button.row,.row{transition:background .15s;border-radius:12px;padding-left:10px;padding-right:10px;margin-left:-10px;margin-right:-10px}
  .chip:hover{background:var(--sunk)}
  .chip[aria-pressed="true"]:hover{background:var(--ink)}
  .btn:hover{filter:brightness(1.07)}
  .btn:active{filter:brightness(.95)}
  nav.tabs button:hover{background:var(--sunk)}
  .kpis div,.panel,.strip div{transition:box-shadow .2s,transform .2s}
  .tbl .tr:hover{background:var(--sunk)}
}

/* Tablet: two columns, wider gutters */
@media (min-width:768px){
  main{max-width:900px;padding:16px 24px 130px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 20px;align-content:start}
  header.top,.hero,.strip,.kpis,.chips,.search,.banner,.legend-wrap,section.blk,.trend,.heat,.day,.panel,.note,.seg,p.note,div.note{grid-column:1 / -1}
  section.blk{margin:0}
  .hero .big{font-size:64px}
  .strip{grid-template-columns:repeat(3,1fr)}
  .strip div:last-child{grid-column:auto}
}

/* Desktop: three balanced columns with the summary leading */
@media (min-width:1024px){
  main{max-width:1180px;padding:96px 32px 48px;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px 22px;align-items:start}
  header.top{padding-top:0}
  .banner.quiet{grid-column:span 2}
  .hero{grid-column:span 2;padding:26px 28px}
  .legend-wrap{grid-column:span 1;align-self:stretch;overflow:auto}
  section.blk,.trend{grid-column:span 1}
  section.blk:has(.cw),section.blk:has(.heat),section.blk:has(.tbl){grid-column:span 2}
  .kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
  .chips{margin:0;padding:0 0 4px;flex-wrap:wrap;overflow:visible}
  /* nav moves to the top as a centred pill with an active indicator */
  nav.tabs{position:fixed;top:16px;bottom:auto;left:0;right:0;margin:0 auto;max-width:560px}
  nav.tabs button{flex-direction:row;gap:8px;font-size:13.5px;padding:9px 0;position:relative}
  nav.tabs button[aria-current="page"]{background:var(--accent-soft);border-radius:999px}
  nav.tabs button[aria-current="page"]::after{content:"";position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:18px;height:3px;border-radius:999px;background:var(--accent)}
  nav.tabs .add{width:46px;height:46px;margin-top:0}
  /* sheets become centred dialogs */
  dialog.sheet{margin:auto;border-radius:22px;max-width:560px;max-height:86vh}
  .sheet .hd::before{display:none}
  .sheet .hd h3{margin:0}
}

/* Very large screens: cap the reading width, keep the grid balanced */
@media (min-width:1536px){
  main{max-width:1320px}
  .hero .big{font-size:72px}
}

/* Narrow phones: the header keeps the month picker and the menu; the sync
   wording collapses to its status dot until there is room for words. */
.sync{max-width:1.2em;overflow:hidden;white-space:nowrap;color:transparent}
.sync:not(:empty)::before{margin-right:0}
header.top{gap:6px}
.monthsw{min-width:0}
@media (min-width:480px){ .sync{max-width:none;color:var(--muted)} .sync:not(:empty)::before{margin-right:5px} }
.av.mv{background:var(--accent-soft);color:var(--accent);font-size:17px}
.row .r.mut{color:var(--muted);font-weight:500}

/* Roomier margins: more air around the edges, between blocks and inside cards. */
main{padding:12px 20px 124px}
section.blk{margin:0 0 28px}
section.blk>h2{margin:0 0 12px}
.panel{padding:6px 18px}
.hero{padding:24px 22px 20px;margin:0 0 14px}
.legend-wrap{padding:6px 18px;margin:0 0 16px}
.strip{gap:12px;margin:4px 0 26px}
.strip div{padding:16px 18px}
.kpis{gap:12px;margin:0 0 26px}
.kpis div{padding:16px 18px}
.chips{gap:9px;margin:0 -20px;padding:2px 20px 14px}
.note{margin:10px 2px 0}
.banner{padding:14px 18px;margin:0 0 16px}
.banner.quiet{margin:0 0 26px}
.day{padding:18px 6px 8px}
.sheet .bd{padding:6px 20px calc(28px + env(safe-area-inset-bottom,0px))}
.sheet .hd{padding:12px 20px 8px}
label.f{margin:16px 2px 8px}
.actions{margin-top:24px}
.heat,.trend{padding:16px 18px}
@media (min-width:768px){ main{padding:18px 28px 132px;gap:22px 24px} .chips{margin:0;padding:2px 0 14px} }
@media (min-width:1024px){ main{padding:100px 36px 56px;gap:24px 26px} .hero{padding:30px 32px} }

/* Activity rows: give each line room and keep the secondary text quiet. */
.panel .row,.panel button.row{padding:14px 0;gap:14px}
.row .l b{font-size:15px;line-height:1.35}
.row .l span{font-size:12.5px;margin-top:2px;color:var(--muted)}
.row .r{font-size:15.5px}
.av{width:38px;height:38px;border-radius:12px;font-size:18px}
.av.mv{background:var(--accent-soft);color:var(--accent);font-size:16px;font-weight:700}
.day{font-size:12.5px;letter-spacing:.02em;text-transform:uppercase;color:var(--muted);padding:20px 6px 8px}
.row .r.mut{color:var(--muted);font-weight:500}
.chip.emo{padding:0;width:44px;justify-content:center;font-size:19px}
.chip.emo[aria-pressed="true"]{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}

<script>// ---- Money Manager import mapper ----
var MM = (function () {
  var CAT_MAP = {
    'dates': '💝 Dates', 'help others buy': '🤝 Help others', 'Games': '🎮 Games',
    '❤️ mummy': '❤️ Mummy', 'Other': '📦 Other', '👬 Social Life': '👬 Social life',
    '✌️😭 interest': '💹 Interest', 'Debt payments': '↩️ Paybacks', '💵 Petty cash': '💵 Petty cash'
  };
  var INC_KIND = {
    '📖 Tutoring': 'earned', '🪖 NS pay': 'earned', '🌐 Website': 'earned', '🤑 Allowance': 'earned',
    '💹 Interest': 'earned', '🏅 Bonus': 'other', '↩️ Paybacks': 'reimb', '💵 Petty cash': 'reimb'
  };
  var VENUES = {
    'Moomoo': ['Moomoo', 'broker'], 'IG': ['IG', 'broker'], 'IBKR injections/withdrawals': ['IBKR', 'broker'],
    'Etoro': ['eToro', 'broker'], 'Webull': ['Webull', 'broker'], 'Forex.com': ['Forex.com', 'broker'],
    'HFM': ['HFM', 'broker'], 'AMP FUTURES': ['AMP Futures', 'broker'], 'Crypto': ['Crypto', 'crypto'],
    'Poker': ['Poker', 'poker']
  };
  var STOP = ['owe', 'owes', 'borrow', 'from', 'lend', 'me', 'money', 'pay', 'back', 'anytime', 'during', 'ns',
    'will', 'on', 'cny', 'i', 'to', 'the', 'for'];
  // SheetJS 0.18 truncates astral XML entities (emoji) to 16 bits; restore them.
  function fixMoji(s) {
    var o = '';
    for (var i = 0; i < s.length; i++) {
      var c = s.charCodeAt(i);
      o += (c >= 0xF000 && c <= 0xFAFF) ? String.fromCodePoint(0x10000 + c) : s.charAt(i);
    }
    return o;
  }
  function clean(s) { return fixMoji(s == null ? '' : String(s)).trim(); }
  function propName(note) {
    var n = note.toLowerCase();
    if (n.indexOf('apex') > -1) return 'Apex';
    if (n.indexOf('tradeify') > -1) return 'Tradeify';
    if (n.indexOf('lucid') > -1) return 'Lucid';
    if (n.indexOf('my funded') > -1) return 'MyFundedFutures';
    if (n.indexOf('instant') > -1) return 'Instant Funding';
    return note ? note.split(' ')[0] : 'Prop firm';
  }
  function person(note) {
    if (note.indexOf('(') > -1) return note.split('(')[0].trim();
    var w = note.split(/\s+/).filter(function (x) { return x && STOP.indexOf(x.toLowerCase()) < 0; });
    var p = w[0] || 'Unknown';
    return p.charAt(0).toUpperCase() + p.slice(1).toLowerCase();
  }
  function dateOf(v, XLSX) {
    if (typeof v === 'number') {
      var c = XLSX.SSF.parse_date_code(v);
      return c.y + '-' + String(c.m).padStart(2, '0') + '-' + String(c.d).padStart(2, '0');
    }
    var s = clean(v);
    var m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return m[0];
    m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if (m) return m[3] + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0');
    return null;
  }
  // Find the header row and work out which column is which. Money Manager's
  // exports differ by version, currency and locale, so never trust fixed positions.
  function layout(rows) {
    var L = null;
    for (var i = 0; i < Math.min(rows.length, 12) && !L; i++) {
      var r = rows[i] || [], h = r.map(function (x) { return clean(x).toLowerCase(); });
      var col = { date: -1, account: -1, cat: -1, sub: -1, note: -1, amt: -1, cur: -1, type: -1, desc: -1 };
      h.forEach(function (v, j) {
        var raw = clean(r[j]);
        if (col.date < 0 && /^(date|period|time)/.test(v)) col.date = j;
        else if (col.account < 0 && /account/.test(v)) col.account = j;
        else if (col.cat < 0 && /^categor/.test(v)) col.cat = j;
        else if (col.sub < 0 && /sub.?categor/.test(v)) col.sub = j;
        else if (col.note < 0 && /^(note|memo|remark|title)/.test(v)) col.note = j;
        else if (col.type < 0 && /(income.*expense|^type$|transaction type)/.test(v)) col.type = j;
        else if (col.desc < 0 && /descri/.test(v)) col.desc = j;
        else if (col.cur < 0 && /^currency$/.test(v)) col.cur = j;
        else if (/^[a-z]{3}$/.test(v) && /^[A-Z]{3}$/.test(raw)) { if (col.amt < 0) col.amt = j; }
        else if (col.amt < 0 && /(amount|value|total)/.test(v)) col.amt = j;
      });
      if (col.amt < 0) h.forEach(function (v, j) { if (col.amt < 0 && /(amount|value|total)/.test(v)) col.amt = j; });
      if (col.date > -1 && col.amt > -1 && col.type > -1) { col.header = i; L = col; }
    }
    return L;
  }
  // rows: array of arrays incl. header row
  function map(rows, XLSX) {
    var out = { tx: [], ledger: [], debts: [], venues: {}, cats: {}, skipped: 0, headers: [] };
    var n = 0;
    function id() { n++; return 'mm' + n; }
    var L = layout(rows);
    if (!L) { L = { header: 0, date: 0, account: 1, cat: 2, sub: 3, note: 4, amt: 5, type: 6, desc: 7 }; out.guessed = true; }
    out.headers = (rows[L.header] || []).map(function (x) { return clean(x); }).filter(Boolean);
    function cell(r, j) { return j > -1 && j < r.length ? r[j] : ''; }
    for (var i = L.header + 1; i < rows.length; i++) {
      var r = rows[i]; if (!r || !r.length) continue;
      var d = dateOf(cell(r, L.date), XLSX), acct = clean(cell(r, L.account)), cat = clean(cell(r, L.cat)), sub = clean(cell(r, L.sub)),
        note = clean(cell(r, L.note)) || clean(cell(r, L.desc)),
        raw = cell(r, L.amt), amt = Math.abs(typeof raw === 'number' ? raw : parseFloat(String(raw).replace(/[^0-9.\-]/g, ''))),
        type = clean(cell(r, L.type));
      if (!type && amt) type = (typeof raw === 'number' ? raw : parseFloat(String(raw).replace(/[^0-9.\-]/g, ''))) < 0 ? 'Expense' : 'Income';
      if (/^expense/i.test(type)) type = 'Expense'; else if (/^income/i.test(type)) type = 'Income';
      else if (/transfer.?out|^out$/i.test(type)) type = 'Transfer-Out'; else if (/transfer.?in|^in$/i.test(type)) type = 'Transfer-In';
      if (!d || !(amt > 0)) { out.skipped++; continue; }
      amt = Math.round(amt * 100) / 100;
      if (type === 'Expense' || type === 'Income') {
        var c = CAT_MAP[cat] || cat;
        var t = type === 'Expense' ? 'exp' : 'inc';
        var tags = [];
        if (c === '💝 Dates' || /alaina/i.test(note)) tags.push('Alaina');
        out.cats[c] = { name: c, type: t, kind: t === 'inc' ? (INC_KIND[c] || 'other') : undefined };
        out.tx.push({ id: id(), d: d, t: t, amt: amt, cat: c, sub: sub, note: note, tags: tags, src: 'mm' });
      } else if (type === 'Transfer-Out') {
        var from = acct, to = cat;
        if (to === 'People Owe me Money' || from === 'People Owe me Money') {
          out.debts.push({ id: id(), d: d, person: person(note), amt: to === 'People Owe me Money' ? amt : -amt, note: note, src: 'mm' });
        } else if (to === 'Propfirms') {
          var pn = propName(note);
          out.venues[pn] = { name: pn, type: 'prop' };
          out.ledger.push({ id: id(), d: d, venue: pn, f: 'in', amt: amt, note: note, src: 'mm' });
        } else if (VENUES[to] || VENUES[from]) {
          var isIn = !!VENUES[to];
          var v = VENUES[isIn ? to : from];
          out.venues[v[0]] = { name: v[0], type: v[1] };
          out.ledger.push({ id: id(), d: d, venue: v[0], f: isIn ? 'in' : 'out', amt: amt, note: note, src: 'mm' });
        } else if (to === 'Misplaced balancer') {
          out.cats['❓ Unaccounted'] = { name: '❓ Unaccounted', type: 'exp' };
          out.tx.push({ id: id(), d: d, t: 'exp', amt: amt, cat: '❓ Unaccounted', sub: '', note: note || 'Unaccounted', tags: [], src: 'mm' });
        } else if (from === 'Misplaced balancer' && to === 'Cash') {
          var isFam = /clement|mummy|mum/i.test(note) && !/initial|balance/i.test(note);
          if (isFam) {
            out.cats['🏅 Bonus'] = { name: '🏅 Bonus', type: 'inc', kind: 'other' };
            out.tx.push({ id: id(), d: d, t: 'inc', amt: amt, cat: '🏅 Bonus', sub: '', note: note, tags: [], src: 'mm' });
          } else {
            out.tx.push({ id: id(), d: d, t: 'adj', amt: amt, cat: '🔧 Adjustment', sub: '', note: note, tags: [], src: 'mm' });
          }
        } else { out.skipped++; }
      } else { out.skipped++; }
    }
    return out;
  }
  return { map: map };
})();

</script>
<script>(function () {
'use strict';
// ---------- helpers ----------
var $ = function (s, r) { return (r || document).querySelector(s); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function uid() { return 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function r2(n) { return Math.round(n * 100) / 100; }
function money(n, dp) {
  if (n == null || isNaN(n)) return '–';
  var d = dp == null ? (Math.abs(n) >= 1000 ? 0 : 2) : dp;
  var s = Math.abs(n).toLocaleString('en-SG', { minimumFractionDigits: d, maximumFractionDigits: d });

// ---------- state ----------
var DEFAULT_CATS = [
  ['🍜 Food', 'exp'], ['🚖 Transport', 'exp'], ['💝 Dates', 'exp'], ['🗓 Subscriptions', 'exp'], ['🧥 Shopping', 'exp'],
  ['❤️ Mummy', 'exp'], ['✝️ Church', 'exp'], ['🤝 Help others', 'exp'], ['🎁 Gift', 'exp'], ['🎮 Games', 'exp'],
  ['👬 Social life', 'exp'], ['🎟 Experiences', 'exp'], ['❓ Unaccounted', 'exp'], ['📦 Other', 'exp'],
  ['📖 Tutoring', 'inc', 'earned'], ['🪖 NS pay', 'inc', 'earned'], ['🌐 Website', 'inc', 'earned'], ['💹 Interest', 'inc', 'earned'],
  ['🤑 Allowance', 'inc', 'earned'], ['🏅 Bonus', 'inc', 'other'], ['↩️ Paybacks', 'inc', 'reimb'], ['💵 Petty cash', 'inc', 'reimb']
];
function freshMeta() {
  return { cats: DEFAULT_CATS.map(function (c) { return { name: c[0], type: c[1], kind: c[2] }; }), tags: ['Alaina'], budgets: [], subs: [], venues: {}, accounts: [], rules: [], subcats: {}, basis: 'cash' };
}
var S = { meta: freshMeta(), ledger: [], debts: [], tx: {}, inbox: [], checks: [], bills: [] };
function normalize() { S.bills = S.bills || []; S.bills.forEach(function (b) { if (!b.from && b.month) b.from = b.month + '-01'; }); S.inbox = S.inbox || []; S.checks = S.checks || []; S.meta.accounts = S.meta.accounts || []; S.meta.rules = S.meta.rules || []; S.meta.venues = S.meta.venues || {};
  S.meta.subcats = S.meta.subcats || {};
  allTx().forEach(function (t) { rememberSub(t.cat, t.sub); }); }
var UI = { folds: {}, acct: 'inv', tab: 'home', month: monthOf(today()), filter: 'all', q: '', all: false };
var LS_KEY = 'ledger-state-v1';
var store = { mode: 'connecting', col: null, dirty: {}, timer: null, writing: false };

// What the transaction actually cost you: if you paid for others, only your share
// counts as spending. The rest is money owed to you, tracked under People.
function ea(t) { return t.t === 'exp' && t.split && t.split.mine >= 0 ? t.split.mine : t.amt; }

function catObj(name) { for (var i = 0; i < S.meta.cats.length; i++) if (S.meta.cats[i].name === name) return S.meta.cats[i]; return null; }
function incKind(name) { var c = catObj(name); return (c && c.kind) || 'other'; }
function cleanSub(s) { return String(s == null ? '' : s).replace(/\s+/g, ' ').trim(); }
function rememberSub(cat, sub) {
  sub = cleanSub(sub); if (!cat || !sub) return;
  S.meta.subcats = S.meta.subcats || {};
  var a = S.meta.subcats[cat] = S.meta.subcats[cat] || [];
  if (a.indexOf(sub) < 0) { a.push(sub); a.sort(function (x, y) { return x.localeCompare(y); }); }
}
function subsFor(cat) { return (S.meta.subcats && S.meta.subcats[cat]) ? S.meta.subcats[cat].slice() : []; }
function removeKnownSub(cat, sub) {
  if (!S.meta.subcats || !S.meta.subcats[cat]) return;
  S.meta.subcats[cat] = S.meta.subcats[cat].filter(function (x) { return x !== sub; });
  if (!S.meta.subcats[cat].length) delete S.meta.subcats[cat];
}
function cashBasis() { return (S.meta.basis || 'cash') === 'cash'; }
function isClosed(v) { return !!(S.meta.venues[v] && S.meta.venues[v].closed); }
function venueType(v) { return (S.meta.venues[v] && S.meta.venues[v].type) || 'broker'; }

// ---------- persistence ----------
function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) { } }
function loadLocal() {
  try { var raw = localStorage.getItem(LS_KEY); if (raw) { var o = JSON.parse(raw); if (o && o.meta) S = o; } } catch (e) { }

function mark(key) { store.dirty[key] = true; saveLocal(); saveDirty(); schedule(); }
function markMonth(m) { mark('tx-' + m); }
function schedule() { clearTimeout(store.timer); store.timer = setTimeout(flush, 700); }
function bodyFor(key) {
  if (key === 'meta') return JSON.parse(JSON.stringify(S.meta));
  if (key === 'ledger') return { entries: S.ledger };
  if (key === 'debts') return { entries: S.debts };
  if (key === 'inbox') return { items: S.inbox };
  if (key === 'checks') return { entries: S.checks };
  if (key === 'bills') return { entries: S.bills };
  var m = key.slice(3); return (S.tx[m] && S.tx[m].length) ? { items: S.tx[m] } : null;
}
function saveDirty() { try { localStorage.setItem('ledger-dirty', JSON.stringify(Object.keys(store.dirty))); } catch (e) { } }
function flush() {
  if (store.mode !== 'cloud' || store.writing) return;
  var keys = Object.keys(store.dirty); if (!keys.length) return;
  if (navigator.onLine === false) { setSync('Offline, will sync'); return; }
  store.writing = true; setSync('Saving…');
  (function next() {
    var k = keys.shift();
    if (!k) { store.writing = false; saveDirty(); setSync('Synced'); if (Object.keys(store.dirty).length) schedule(); return; }
    delete store.dirty[k];

}

// Keep the People ledger in step with a split: the part you covered is owed to you.
function syncSplitDebt(t) {
  S.debts = S.debts.filter(function (d) { return d.txId !== t.id; });
  if (t.split && t.amt > t.split.mine) {
    S.debts.push({ id: uid(), txId: t.id, d: t.d, person: t.split.person, amt: r2(t.amt - t.split.mine), note: (t.note || t.cat) + ', their share', src: 'app' });
  }
  mark('debts');
}
function removeTx(t) {
  if (S.debts.some(function (d) { return d.txId === t.id; })) { S.debts = S.debts.filter(function (d) { return d.txId !== t.id; }); mark('debts'); }
  var m = monthOf(t.d), a = S.tx[m] || [];
  for (var i = 0; i < a.length; i++) if (a[i].id === t.id) { a.splice(i, 1); break; }
  if (!a.length) delete S.tx[m];
  markMonth(m);
}
function findTx(id) { var a = allTx(); for (var i = 0; i < a.length; i++) if (a[i].id === id) return a[i]; return null; }

var FLOW_LABELS = {

function ledgerSheet(opts) {

  var names = Object.keys(venuesByType()).reduce(function (a, k) { return a.concat(venuesByType()[k].map(function (v) { return v.name; })); }, []).sort();

    '<label class="f">Status</label><div class="seg" id="vcl"><button data-cl="0" aria-pressed="' + !isClosed(v) + '">Still using</button><button data-cl="1" aria-pressed="' + isClosed(v) + '">Closed</button></div>';

  });

var DEBT_ACTS = [['lent', 'I lent them', 1], ['repaid', 'They paid me back', -1], ['borrowed', 'I borrowed', -1], ['paid', 'I paid them back', 1],
  ['held', 'They gave me money to invest or hold', -1], ['returned', 'I gave their money back', 1]];
function debtSheet(person) {
  var act = 'lent', ppl = {}; S.debts.forEach(function (d) { ppl[d.person] = 1; });
  var hist = person ? S.debts.filter(function (d) { return d.person === person; }).sort(function (a, b) { return a.d < b.d ? 1 : -1; }) : [];
  var body = '<label class="f" for="per">Person</label><input class="t" id="per" list="pl" value="' + esc(person || '') + '"><datalist id="pl">' + Object.keys(ppl).map(function (p) { return '<option value="' + esc(p) + '">'; }).join('') + '</datalist>' +
    '<label class="f">What happened</label><div class="wrap" id="da">' + DEBT_ACTS.map(function (a) { return '<button class="chip" data-a="' + a[0] + '" aria-pressed="' + (a[0] === act) + '">' + a[1] + '</button>'; }).join('') + '</div>' +
    '<div class="amt-in" style="margin-top:12px"><span>$</span><input id="amt" inputmode="decimal" placeholder="0.00" aria-label="Amount"></div>' +
    '<label class="f" for="note">Note</label><input class="t" id="note">' +
    '<label class="f" for="dt">Date</label><input class="t" type="date" id="dt" value="' + today() + '">' +
    '<div class="actions"><button class="btn" id="save">Save</button></div>';

    if (Math.abs(bal) > 0.005) {
      body = '<div class="kv" style="margin-top:0"><span>' + (bal > 0 ? esc(person) + ' owes you' : 'You owe ' + esc(person)) + '</span><span>' + money(Math.abs(bal)) + '</span></div>' +
        '<div class="actions" style="margin:6px 0 18px"><button class="btn ghost" id="settle">Settle up</button></div>' + body;
    }
  }
  if (hist.length) {
    body += '<label class="f" style="margin-top:20px">History (tap to delete)</label><div class="panel">' + hist.map(function (d) {
      return '<button class="row" data-dd="' + esc(d.id) + '"><div class="l"><b>' + esc(d.note || (d.amt > 0 ? 'They owe more' : 'They owe less')) + '</b><span>' + dayLabel(d.d) + '</span></div><div class="r">' + (d.amt > 0 ? '+' : '−') + money(Math.abs(d.amt)) + '</div></button>';

      closeSheet(); render(); toast('Saved');
    });
    el.querySelectorAll('[data-dd]').forEach(function (b) { b.addEventListener('click', function () { if (!confirm('Delete this entry?')) return; S.debts = S.debts.filter(function (d) { return d.id !== b.dataset.dd; }); mark('debts'); closeSheet(); render(); }); });
  });

// Real life: people pay back a round number, or a bit off. Settle the balance in one go
// and put the difference where it belongs instead of leaving a stray few dollars forever.
function settleSheet(person) {
  var bal = r2(sum(S.debts.filter(function (d) { return d.person === person; }), function (d) { return d.amt; }));
  var body = '<div class="kv" style="margin-top:0"><span>Balance</span><span>' + (bal > 0 ? esc(person) + ' owes you ' : 'You owe ' + esc(person) + ' ') + money(Math.abs(bal)) + '</span></div>' +
    '<label class="f">Amount actually ' + (bal > 0 ? 'received' : 'paid') + '</label><div class="amt-in"><span>$</span><input id="sa" inputmode="decimal" value="' + Math.abs(bal) + '" aria-label="Amount"></div>' +
    '<label class="f" for="sd">Date</label><input class="t" type="date" id="sd" value="' + today() + '">' +
    '<label class="f">If it does not cover the balance</label><div class="seg" id="sm"><button data-sm="close" aria-pressed="true">Call it settled</button><button data-sm="part" aria-pressed="false">Leave the rest owing</button></div>' +
    '<p class="note" id="smsg"></p><div class="actions"><button class="btn" id="sgo">Record it</button></div>';
  openSheet('Settle up with ' + person, body, function (el) {
    var mode = 'close';
    $('#sm', el).addEventListener('click', function (e) {
      var b = e.target.closest('[data-sm]'); if (!b) return; mode = b.dataset.sm;
      el.querySelectorAll('#sm button').forEach(function (x) { x.setAttribute('aria-pressed', x === b); }); msg();
    });
    function msg() {
      var a = parseFloat($('#sa', el).value), diff = r2(Math.abs(bal) - (isNaN(a) ? 0 : a));
      if (mode === 'part' && Math.abs(diff) > 0.005) {
        $('#smsg', el).textContent = money(Math.abs(diff)) + (diff > 0 ? ' stays on the balance for later.' : ' extra, so the balance flips the other way.');
        return;
      }
      $('#smsg', el).textContent = Math.abs(diff) < 0.005 ? 'Settles exactly. Nothing left over.'
        : bal > 0
          ? (diff > 0 ? money(diff) + ' short. The shortfall is added to your spending and the balance is cleared.' : money(-diff) + ' extra. It is recorded as a small gain and the balance is cleared.')
          : (diff > 0 ? money(diff) + ' less than you owed. The saving is recorded as a small gain.' : money(-diff) + ' more than you owed, so the extra counts as spending.');
    }
    var near = allTx().filter(function (t) {
      return t.t === 'inc' && incKind(t.cat) === 'reimb' && Math.abs(new Date(t.d) - new Date(today())) / 864e5 <= 14 &&
        ((t.note || '').toLowerCase().indexOf(person.toLowerCase()) > -1 || Math.abs(t.amt - Math.abs(bal)) <= 2);
    });
    if (near.length) {
      var w = document.createElement('p'); w.className = 'warn';
      w.textContent = 'You already logged ' + money(near[0].amt) + ' as a payback on ' + dayLabel(near[0].d) + '. If that was this repayment, delete it rather than recording it here as well.';
      $('#smsg', el).parentNode.insertBefore(w, $('#smsg', el));
    }
    $('#sa', el).addEventListener('input', msg); msg();
    $('#sgo', el).addEventListener('click', function () {
      var a = parseFloat($('#sa', el).value), d = $('#sd', el).value || today();
      if (isNaN(a) || a < 0) { toast('Enter an amount'); return; }
      var paid = r2(a), diff = r2(Math.abs(bal) - paid);
      S.debts.push({ id: uid(), d: d, person: person, amt: bal > 0 ? -paid : paid, note: mode === 'part' ? 'Part payment' : 'Settled up', src: 'app' });
      if (mode === 'part') { mark('debts'); closeSheet(); render(); toast('Recorded'); return; }
      if (Math.abs(diff) > 0.005) {
        S.debts.push({ id: uid(), d: d, person: person, amt: bal > 0 ? -diff : diff, note: 'Difference written off', src: 'app' });
        var short = (bal > 0 && diff > 0) || (bal < 0 && diff < 0);
        var m = monthOf(d), amt = Math.abs(diff);
        if (short) {
          var c = '📦 Other'; if (!catObj(c)) S.meta.cats.push({ name: c, type: 'exp' });
          (S.tx[m] = S.tx[m] || []).push({ id: uid(), d: d, t: 'exp', amt: amt, cat: c, sub: '', note: 'Shortfall settling up with ' + person, tags: [], src: 'app' });
        } else {
          (S.tx[m] = S.tx[m] || []).push({ id: uid(), d: d, t: 'adj', amt: amt, cat: '🔧 Adjustment', sub: '', note: 'Extra from settling up with ' + person, tags: [], src: 'app' });
        }
        markMonth(m); mark('meta');
      }
      mark('debts'); closeSheet(); render(); toast('Settled with ' + person);
    });
  });
}

  S.ledger.forEach(function (e) { if (e.d > a && e.d <= b && e.f !== 'bal') n += e.f === 'out' ? e.amt : -e.amt; });

// ---------- PayLater: every purchase and every payment kept as its own record ----------
// Grab bills a statement period of PayLater spending as one bill, payable in full the
// next month or split over 4, 8 or 12 monthly payments (8 and 12 carry a processing fee).
var PL_SPLITS = [1, 4, 8, 12];
function cycleDay() { return Math.min(28, Math.max(1, S.meta.plCycle || 1)); }
function pad2(n) { return String(n).padStart(2, '0'); }
function dayBefore(d) { var x = new Date(d + 'T00:00:00'); x.setDate(x.getDate() - 1); return x.getFullYear() + '-' + pad2(x.getMonth() + 1) + '-' + pad2(x.getDate()); }
function periodStart(d) { var m = monthOf(d), cs = cycleDay(); if (+d.slice(8, 10) < cs) m = addMonth(m, -1); return m + '-' + pad2(cs); }
function periodEnd(from) { return dayBefore(addMonth(monthOf(from), 1) + '-' + from.slice(8, 10)); }
function periodLabel(from) {
  var to = periodEnd(from);
  return cycleDay() === 1 ? monthLabel(monthOf(from)) : dayLabel(from) + ' to ' + dayLabel(to);
}
function laterItems(from) {
  var to = periodEnd(from), out = [];
  allTx().forEach(function (t) { if (t.t === 'exp' && t.pm === 'later' && t.d >= from && t.d <= to) out.push(t); });
  return out.sort(function (a, b) { return a.d < b.d ? -1 : a.d > b.d ? 1 : 0; });
}
function billFor(from) { return S.bills.filter(function (b) { return b.from === from; })[0] || null; }
function billTotal(b) { return r2(sum(laterItems(b.from), function (t) { return t.amt; })); }
function billDue(b) { return r2(billTotal(b) + (b.fee || 0)); }
function billPaid(b) { return r2(sum(b.payments || [], function (p) { return p.amt; })); }
function billLeft(b) { return r2(billDue(b) - billPaid(b)); }

  var n = b.n || 1, due = billDue(b), each = r2(due / n), out = [], paid = billPaid(b);
  var first = b.first || (addMonth(monthOf(periodEnd(b.from)), 1) + '-' + pad2(Math.min(28, +periodEnd(b.from).slice(8, 10))));
  for (var i = 0; i < n; i++) {
    var amt = i === n - 1 ? r2(due - each * (n - 1)) : each;
    var covered = Math.min(amt, Math.max(0, paid - each * i));
    out.push({ i: i, d: addMonth(monthOf(first), i) + '-' + first.slice(8, 10), amt: amt, part: r2(covered), paid: covered >= amt - 0.01 });
  }

}
function periods() {
  var ps = {};
  allTx().forEach(function (t) { if (t.t === 'exp' && t.pm === 'later') ps[periodStart(t.d)] = 1; });
  S.bills.forEach(function (b) { ps[b.from] = 1; });
  return Object.keys(ps).sort().reverse();
}
function laterOwed() {

}

  var out = null;

  return out;
}

    var m = addMonth(monthOf(today()), i), amt = 0;
    S.bills.forEach(function (b) { billSchedule(b).forEach(function (s) { if (!s.paid && monthOf(s.d) === m) amt += s.amt - s.part; }); });
    out.push({ m: m, amt: r2(amt) });
  }
  return out;
}

    '<span>Next payment</span><span>' + (nx ? money(nx.amt) + ' on ' + dayLabel(nx.d) : 'Nothing scheduled') + '</span></div>';

    body += '<button class="row" data-bill="' + f + '"><div class="l"><b>' + periodLabel(f) + '</b><span>' + sub + '</span></div><div class="r">' + money(b ? billDue(b) : tot) + '</div></button>';
  });
  body += '</div><label class="f" for="cyc">Statement period starts on day</label><input class="t" id="cyc" inputmode="numeric" value="' + cycleDay() + '">' +
    '<p class="note">Grab bills a whole period at once. Set the day your bill period starts so purchases fall into the right bill. Your purchases and payments stay separate records either way.</p>';

function billSheet(from) {
  var b = billFor(from);
  if (!b) { b = { id: uid(), from: from, n: 1, fee: 0, first: '', payments: [] }; S.bills.push(b); mark('bills'); }
  function save() { mark('bills'); render(); }

  // c4 transport
  var tr = ms.map(function (m) {
    var g = 0, p = 0; (S.tx[m] || []).forEach(function (t) { if (t.t === 'exp' && t.cat === '🚖 Transport') { if (/grab/i.test((t.sub || '') + ' ' + (t.note || ''))) g += ea(t); else p += ea(t); } }); return [r2(g), r2(p)];
  });
  mk('c4', { type: 'bar', data: { labels: labels, datasets: [Object.assign({ label: 'Grab', data: tr.map(function (x) { return x[0]; }), backgroundColor: pal[1] }, bar, { borderRadius: 0 }), Object.assign({ label: 'Public transport and other', data: tr.map(function (x) { return x[1]; }), backgroundColor: pal[0] }, bar)] }, options: base(true) });
  // c5 weekday
  var exps = allTx().filter(function (t) { return t.t === 'exp' && ms.indexOf(monthOf(t.d)) > -1; }), byDay = {};
  exps.forEach(function (t) { byDay[t.d] = (byDay[t.d] || 0) + ea(t); });
  var wd = [0, 0, 0, 0, 0, 0, 0], wn = [0, 0, 0, 0, 0, 0, 0], last = addMonth(ms[ms.length - 1], 1) + '-01';
  for (var dt = new Date(ms[0] + '-01T00:00:00'); ; dt.setDate(dt.getDate() + 1)) {
    var k = dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
    if (k >= last || k > today()) break; var w = (dt.getDay() + 6) % 7; wd[w] += byDay[k] || 0; wn[w]++;
  }
  var wa = wd.map(function (v, i) { return wn[i] ? r2(v / wn[i]) : 0; }), mx = Math.max.apply(null, wa);
  mk('c5', { type: 'bar', data: { labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'], datasets: [Object.assign({ label: 'Average', data: wa, backgroundColor: wa.map(function (v) { return v === mx ? pal[0] : (isDark() ? '#2B3346' : '#CDD5E4'); }) }, bar)] }, options: base(false) });
  // c6 income sources
  var incs = {}; allTx().filter(function (t) { return t.t === 'inc' && ms.indexOf(monthOf(t.d)) > -1; }).forEach(function (t) { incs[t.cat] = (incs[t.cat] || 0) + t.amt; });
  var ik = Object.keys(incs).sort(function (a, b) { return incs[b] - incs[a]; });
  mk('c6', { type: 'bar', data: { labels: ik, datasets: [Object.assign({ label: 'Total', data: ik.map(function (k) { return r2(incs[k]); }), backgroundColor: ik.map(function (k) { return incKind(k) === 'earned' ? cssv('--gain') : incKind(k) === 'reimb' ? (isDark() ? '#3A4D94' : '#A9BBFF') : pal[3]; }) }, bar)] }, options: base(false, true) });
  // c7 cumulative trading
  var le = S.ledger.filter(function (e) { var t = venueType(e.venue); return (t === 'prop' || t === 'poker') && e.f !== 'bal'; }).sort(function (a, b) { return a.d < b.d ? -1 : 1; });
  if (le.length) {
    var days = [], seen = {}; le.forEach(function (e) { if (!seen[e.d]) { seen[e.d] = 1; days.push(e.d); } });
    var cp = 0, ck = 0, P = [], K = [];
    days.forEach(function (d) { le.filter(function (e) { return e.d === d; }).forEach(function (e) { var v = e.f === 'out' ? e.amt : -e.amt; if (venueType(e.venue) === 'prop') cp += v; else ck += v; }); P.push(r2(cp)); K.push(r2(ck)); });
    mk('c7', { type: 'line', data: { labels: days.map(function (d) { return dayLabel(d); }), datasets: [
      { label: 'Prop firms', data: P, borderColor: pal[6], backgroundColor: pal[6], borderWidth: 2, pointRadius: 0, stepped: true, fill: { target: 'origin', above: 'transparent', below: pal[6] + '1a' } },
      { label: 'Poker', data: K, borderColor: pal[4], backgroundColor: pal[4], borderWidth: 2, pointRadius: 0, stepped: true, borderDash: [5, 4] }] },
      options: Object.assign(base(false), { interaction: { mode: 'index', intersect: false }, scales: { x: { grid: { display: false }, border: { display: false }, ticks: { maxTicksLimit: 5, maxRotation: 0 } }, y: { grid: { color: grid }, border: { display: false }, ticks: { callback: fmt, maxTicksLimit: 5 } } } }) });
  }
}

// ---------- events ----------
function onClick(e) {
  var t = e.target;
  if (t.closest('[data-close]')) { closeSheet(); return; }
  var b;
  if ((b = t.closest('[data-tab]'))) { UI.tab = b.dataset.tab; closeSheet(); render(); window.scrollTo(0, 0); return; }
  if ((b = t.closest('[data-acct]'))) { UI.acct = b.dataset.acct; render(); window.scrollTo(0, 0); return; }
  if ((b = t.closest('[data-range]'))) { UI.range = +b.dataset.range; render(); return; }
  if ((b = t.closest('[data-filter]'))) { UI.filter = b.dataset.filter; render(); return; }
  if ((b = t.closest('[data-edit-xfer]'))) { var xf = findTx(b.dataset.editXfer); if (xf) xferSheet(xf); return; }
  if ((b = t.closest('[data-edit-tx]'))) { var x = findTx(b.dataset.editTx); if (x) txSheet(x); return; }
  if ((b = t.closest('[data-venue]'))) { venueSheet(b.dataset.venue); return; }
  if ((b = t.closest('[data-person]'))) { debtSheet(b.dataset.person); return; }
  if ((b = t.closest('[data-paysub]'))) {
    var sb = S.meta.subs.filter(function (q) { return q.id === b.dataset.paysub; })[0];
    if (sb) {
      var c = '🗓 Subscriptions'; if (!catObj(c)) S.meta.cats.push({ name: c, type: 'exp' });
      var d = sb.next || today(), mm = monthOf(d);
      (S.tx[mm] = S.tx[mm] || []).push({ id: uid(), d: d, t: 'exp', amt: sb.amt, cat: c, sub: '', note: sb.name, tags: [], src: 'app' });
      sb.next = addMonth(monthOf(d), sb.cycle || 1) + '-' + d.slice(8, 10);
      markMonth(mm); mark('meta'); render(); toast('Logged ' + sb.name);
    }
    return;
  }
  if ((b = t.closest('[data-sub]'))) { var s = S.meta.subs.filter(function (q) { return q.id === b.dataset.sub; })[0]; if (s) subSheet(s); return; }
  if ((b = t.closest('[data-sugg]'))) { var sg = subSuggestions().filter(function (q) { return q.note === b.dataset.sugg; })[0]; if (sg) subSheet(null, { name: sg.note, amt: sg.amt }); return; }
  if ((b = t.closest('[data-act]'))) {
    var a = b.dataset.act;
    if (a === 'prev') { UI.month = addMonth(UI.month, -1); render(); }
    else if (a === 'accttab') render();
    else if (a === 'dupes') dupeSheet();
    else if (a === 'next') { UI.month = addMonth(UI.month, 1); render(); }
    else if (a === 'add-tx') txSheet();
    else if (a === 'add-ledger') ledgerSheet();
    else if (a === 'add-debt') debtSheet();
    else if (a === 'add-sub') subSheet();
    else if (a === 'budgets') budgetSheet();
    else if (a === 'cats') catSheet();
    else if (a === 'import') importSheet();
    else if (a === 'export') exportData();
    else if (a === 'theme') themeSheet();
    else if (a === 'check') checkSheet();
    else if (a === 'paylater') payLaterSheet();
    else if (a === 'basis') basisSheet();
    else if (a === 'sync') syncSheet();
    else if (a === 'allmonths') { UI.all = !UI.all; render(); }
    else if (a === 'install') installSheet();
    else if (a === 'csv') exportCsv('tx');
    else if (a === 'csvinv') exportCsv('inv');
    else if (a === 'cleanup') csvImportSheet();
    else if (a === 'restore') restoreSheet();
    else if (a === 'signout') { store.sb.auth.signOut().then(function () { try { localStorage.removeItem(LS_KEY); localStorage.removeItem('ledger-dirty'); } catch (e) { } S = { meta: freshMeta(), ledger: [], debts: [], tx: {}, inbox: [], checks: [], bills: [] }; store.mode = 'auth'; render(); }); }
    else if (a === 'stmt') stmtSheet();
    else if (a === 'inbox') inboxSheet();
    else if (a === 'clear-rules') { if (confirm('Remove all auto-tag rules?')) { S.meta.rules = []; mark('meta'); render(); } }
  }
}

function boot() {
  dlg = $('#sheet');
  applyTheme();
  loadLocal();
  document.addEventListener('click', onClick);
  dlg.addEventListener('click', function (e) { if (e.target === dlg) closeSheet(); });
  var q = new URLSearchParams(location.search);
  if (q.get('tab')) UI.tab = q.get('tab');
  render();
  if (q.get('add')) txSheet();
  connect();
  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(function () { });
}
window.__ledger = { S: function () { return S; }, applyImport: applyImport, render: render, UI: UI };
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
